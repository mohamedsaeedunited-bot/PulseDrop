name: pulsedrop
description: PulseDrop v3 - Fast, local Wi-Fi file, media stream & chat sharing app.
publish_to: 'none'
version: 3.0.0+3

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  file_picker: ^8.1.2
  path_provider: ^2.1.4
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.2
  shared_preferences: ^2.3.2
  open_filex: ^4.5.0
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/pulsedrop_icon.png"
  adaptive_icon_background: "#4F46E5"
  adaptive_icon_foreground: "assets/icon/pulsedrop_foreground.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/pulsedrop_icon.png
