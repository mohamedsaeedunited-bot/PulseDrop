name: pulsedrop
description: PulseDrop v4 - Fast Local File Sharing (Wi-Fi Auto-Discovery, Bluetooth Scan, Web Portal & QR)
publish_to: 'none'
version: 4.0.0+4

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  file_picker: ^10.0.0
  http: ^1.2.2
  network_info_plus: ^6.1.1
  permission_handler: ^11.3.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.2
  flutter_blue_plus: ^1.34.5
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  open_filex: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
flutter_launcher_icons:
  android: true
  ios: false
 image_path: "assets/icon/pulsedrop_icon.png"
  adaptive_icon_background: "#0F172A"
  adaptive_icon_foreground: "assets/icon/pulsedrop_foreground.png"
